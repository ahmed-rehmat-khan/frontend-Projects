<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Velvet Spoon</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero small">
      <nav class="topbar">
        <a class="brand" href="index.html">Velvet Spoon</a>
        <div class="nav-links">
          <a href="menu.html">Menu</a>
          <a href="about.html">About</a>
          <a href="gallery.html">Gallery</a>
          <a href="catering.html">Catering</a>
          <a href="contact.html">Contact</a>
          <a href="order.html" class="button">Order Now</a>
        </div>
      </nav>
      <div class="hero-content narrow">
        <p class="eyebrow">Visit us</p>
        <h1>We’d love to welcome you in person or online.</h1>
      </div>
    </header>
    <main class="section">
      <div class="image-row">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=80" alt="Velvet Spoon interior" />
        <div class="image-stack">
          <img src="https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=900&q=80" alt="Fresh dessert service" />
          <img class="secondary" src="https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=900&q=80" alt="Dessert service detail" />
        </div>
      </div>
      <div class="cards" style="margin-top: 24px;">
        <article class="card">
          <h3>Reach out</h3>
          <p>Email: hello@velvetspoon.com</p>
          <p>Phone: +1 (555) 014-2234</p>
        </article>
        <article class="card">
          <h3>Hours</h3>
          <p>Mon–Thu: 11am–10pm</p>
          <p>Fri–Sun: 11am–11pm</p>
        </article>
        <article class="card">
          <h3>Visit</h3>
          <p>128 Orchard Avenue</p>
          <p>Westfield, CA 90210</p>
        </article>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
